[package]
name = "mab-compass"
version = "2.0.0"
description = "Mab-Compass v2.0 — Path Ahead, Knowledge Vault & Mab-Focus Sync"
authors = ["MabOS Architect"]
edition = "2021"
default-run = "mab-compass"

[lib]
name = "mab_compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mab-compass"
path = "src/main.rs"

[[bin]]
name = "mab-compass-mcp"
path = "src/bin/mab_compass_mcp.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6.1"
rust_xlsxwriter = "0.76"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.8", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
pdf-extract = "0.12"
quick-xml = "0.42"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.10"

